<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <script>
      // Apply the stored theme before first paint. The Svelte store does this
      // too, but not until it mounts -- which is a full white flash on every
      // load, since the app defaults to dark. Must stay in sync with
      // getInitialTheme() in src/lib/theme.js.
      (function () {
        try {
          var t = localStorage.getItem('kanban-theme');
          if (t !== 'light') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
